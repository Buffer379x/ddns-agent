services:
  ddns-agent:
    build: .
    image: ddns-agent:local
    container_name: ddns-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ddns-data:/data
    environment:
      DDNS_DATA_DIR: /data
      DDNS_PORT: '8080'
      # Optional for Unraid-owned appdata:
      # DDNS_UID: '99'
      # DDNS_GID: '100'
      # Trust only the actual reverse proxy network, when applicable:
      # DDNS_TRUSTED_PROXIES: '172.20.0.0/24'
volumes:
  ddns-data:
